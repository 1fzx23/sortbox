[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sortbox"
version = "1.0.0"
description = "零依赖的命令行文件整理工具：按扩展名或日期把文件自动归类到子目录"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["cli", "files", "organize", "productivity", "filesystem"]

[project.scripts]
sortbox = "sortbox:run"

[project.urls]
Homepage = "https://github.com/1fzx23/sortbox"
